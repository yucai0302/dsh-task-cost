name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Test
        run: node --test test/cost.test.mjs
      - name: Build release staging
        run: node scripts/build-release.mjs
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: dist/stage
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-task-cost@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-task-cost@$VERSION is already published; skipping"
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: No token configured
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN secret is not configured; publish skipped. Add it under Settings -> Secrets -> Actions."
